<div class="p-1">
  <div class="flex items-center justify-between pb-3 border-b border-gray-100 dark:border-slate-800">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-red-600 text-white flex items-center justify-center font-bold text-sm">
        <mat-icon style="font-size: 18px; width: 18px; height: 18px;">directions_bus</mat-icon>
      </div>
      <div>
        <h2 class="text-lg font-bold text-gray-900 dark:text-white leading-none m-0">Bus Routes Available</h2>
        <p class="text-xs text-gray-500 dark:text-gray-400 mt-1 mb-0">Select any route below to view and book buses</p>
      </div>
    </div>
    <button mat-dialog-close class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 transition-colors p-1 cursor-pointer">
      <mat-icon style="font-size: 20px; width: 20px; height: 20px;">close</mat-icon>
    </button>
  </div>

  <mat-dialog-content class="mat-typography !p-0 !max-h-[70vh] my-4">
    <div class="rounded-xl overflow-hidden border border-gray-200 dark:border-slate-800 shadow-xs">
      <table mat-table [dataSource]="dataSource" class="w-full text-sm">

        <!-- Position Column -->
        <ng-container matColumnDef="position">
          <th mat-header-cell *matHeaderCellDef class="font-bold text-gray-700 dark:text-gray-300 py-3 px-3"> No. </th>
          <td mat-cell *matCellDef="let element" class="py-3 px-3 text-gray-500 font-medium"> {{element.position}} </td>
        </ng-container>

        <!-- From Column -->
        <ng-container matColumnDef="from">
          <th mat-header-cell *matHeaderCellDef class="font-bold text-gray-700 dark:text-gray-300 py-3 px-3"> From </th>
          <td mat-cell *matCellDef="let element" class="py-3 px-3 font-semibold text-gray-800 dark:text-gray-100"> 
            <span class="flex items-center gap-1.5">
              <mat-icon class="text-red-500" style="font-size: 15px; width: 15px; height: 15px;">location_on</mat-icon>
              {{element.from}}
            </span>
          </td>
        </ng-container>

        <!-- To Column -->
        <ng-container matColumnDef="to">
          <th mat-header-cell *matHeaderCellDef class="font-bold text-gray-700 dark:text-gray-300 py-3 px-3"> To </th>
          <td mat-cell *matCellDef="let element" class="py-3 px-3 font-semibold text-gray-800 dark:text-gray-100"> 
            <span class="flex items-center gap-1.5">
              <mat-icon class="text-rose-500" style="font-size: 15px; width: 15px; height: 15px;">pin_drop</mat-icon>
              {{element.to}}
            </span>
          </td>
        </ng-container>

        <!-- No. of Bus Column -->
        <ng-container matColumnDef="nobus">
          <th mat-header-cell *matHeaderCellDef class="font-bold text-gray-700 dark:text-gray-300 py-3 px-3 text-center"> Buses </th>
          <td mat-cell *matCellDef="let element" class="py-3 px-3 text-center">
            <span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-green-100 text-green-700 dark:bg-green-950 dark:text-green-300">
              {{element.nobus}} Buses
            </span>
          </td>
        </ng-container>

        <!-- Action / View Bus Column -->
        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef class="font-bold text-gray-700 dark:text-gray-300 py-3 px-3 text-right"> Action </th>
          <td mat-cell *matCellDef="let element" class="py-3 px-3 text-right">
            <button (click)="viewBus(element)" 
                    class="px-3.5 py-1.5 bg-red-600 hover:bg-red-700 text-white text-xs font-bold rounded-lg shadow-sm hover:shadow transition-all inline-flex items-center gap-1.5 cursor-pointer">
              <mat-icon style="font-size: 15px; width: 15px; height: 15px;">visibility</mat-icon>
              <span>View Buses</span>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns" class="bg-gray-50 dark:bg-slate-800/80 border-b border-gray-200 dark:border-slate-700"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="hover:bg-red-50/40 dark:hover:bg-slate-800/50 transition-colors border-b border-gray-100 dark:border-slate-800/60"></tr>
      </table>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="!px-0 !pt-2 !pb-0">
    <button mat-button mat-dialog-close class="text-gray-500 hover:text-gray-800 dark:text-gray-400 font-semibold text-xs">
      Cancel
    </button>
  </mat-dialog-actions>
</div>
